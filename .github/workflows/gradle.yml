name: Gradle

on: [push, pull_request]

jobs:
  build:
    # ubuntu-latest ships the Android SDK, ANDROID_HOME set.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: 17
        distribution: 'corretto'
        # intentionally no `cache:` — setup-gradle handles Gradle caching
    - uses: gradle/actions/setup-gradle@v6
    - name: Build with Gradle
      run: ./gradlew --no-daemon --no-watch-fs
